  return '<article class="rc s-'+x.status+'" data-id="'+x.id+'"><div class="av">'+esc((x.name||'?').charAt(0))+'</div><div class="rb"><div class="rh"><h4>'+esc(x.name)+'</h4><span class="kd"><i class="fa-solid '+k[1]+'"></i>'+k[0]+'</span><span class="ago"><i class="fa-regular fa-clock"></i> '+ago(x.created_at)+'</span></div>'+(x.subject?'<div class="sj">'+esc(x.subject)+'</div>':'')+'<div class="mg">'+esc(m)+'</div>'+(m.length>150||m.split('\n').length>3?'<div class="mr" data-more>عرض المزيد</div>':'')+'<div class="ct">'+(x.email?'<a href="mailto:'+esc(x.email)+'"><i class="fa-regular fa-envelope"></i>'+esc(x.email)+'</a>':'')+(x.phone?'<a href="tel:'+esc(x.phone)+'"><i class="fa-solid fa-phone"></i>'+esc(x.phone)+'</a><a class="wa" target="_blank" href="https://wa.me/'+wa(x.phone)+'"><i class="fa-brands fa-whatsapp"></i>WhatsApp</a>':'')+'</div></div><div class="ra"><div class="sg">'+Object.keys(ST).map(function(s){return '<button data-st="'+s+'" class="'+(s===x.status?'on':'')+'" style="--c:'+(s==='new'?'var(--new)':s==='done'?'var(--done)':'var(--prog)')+'"><i class="fa-solid '+ST[s][1]+'"></i>'+ST[s][0]+'</button>'}).join('')+'</div>'+(isAdmin?'<button class="btn o sm" data-del="requests:'+x.id+'" style="color:#ff8a80;border-color:rgba(255,90,90,.35)"><i class="fa-regular fa-trash-can"></i>حذف</button>':'')+'</div></article>'}).join(''):'<div class="em"><i class="fa-regular fa-folder-open"></i>لا توجد طلبات مطابقة</div>'}
$('sq').oninput=function(){qs=this.value;drawReq()};
/* images */
function th(k){$('th-'+k).innerHTML=IM[k].map(function(m,i){return '<div class="tm"><img src="'+esc(m.url||m.prev)+'" alt="" loading="lazy" decoding="async">'+(i===0?'<span class="cv">'+(TY[k].multi?'الغلاف':'الصورة')+'</span>':'<button type="button" class="ib" data-cov="'+k+':'+i+'" title="اجعلها الغلاف"><i class="fa-solid fa-star"></i></button>')+'<button type="button" class="ib d" data-rm="'+k+':'+i+'" title="حذف"><i class="fa-solid fa-xmark"></i></button></div>'}).join('')}

function edit(k,id){var x=DATA[k].filter(function(i){return i.id===id})[0],T=TY[k],f=$('f-'+k);if(!x)return;ED[k]=id;
 T.f.forEach(function(d){f.elements[d[0]].value=x[d[0]]==null?'':x[d[0]]});

 if(k==='news')return '<div class="pc"><div class="pi"><img src="'+esc(c)+'" alt=""><span class="pd">'+new Date().toLocaleDateString('en-US',{month:'short',day:'2-digit',year:'numeric'}).toUpperCase()+'</span></div><div class="pt"><small>'+esc(d.category||'News')+'</small><h3>'+esc(d.title)+'</h3>'+(d.body||'').split(/\n+/).map(function(p){return'<p>'+esc(p)+'</p>'}).join('')+tg+'</div></div>';
 if(k==='projects')return '<div class="pc"><div class="pi"><img src="'+esc(c)+'" alt=""><span class="bg2">'+esc(d.category)+'</span></div><div class="pt"><h3>'+esc(d.title)+'</h3><p>'+esc(d.description)+'</p>'+tg+'</div></div>';
 if(k==='partners')return '<div class="pc lg pp"><div class="pi"><img src="'+esc(c)+'" alt=""></div><div class="pt"><h3>'+esc(d.name)+'</h3></div></div>';
 return '<div class="pc tm2"><div class="pi"><img src="'+esc(c)+'" alt=""><span class="bg2">'+esc(d.role)+'</span></div><div class="pt"><h3>'+esc(d.name)+'</h3><small>'+(d.tier==='executive'?'إدارة عليا':'فريق العمل')+'</small>'+(d.bio?'<p style="margin-top:12px">'+esc(d.bio)+'</p>':'')+'</div></div>'}
function preview(k){if(!$('f-'+k).reportValidity())return;if(!IM[k].length)return toast('أضف صورة واحدة على الأقل');PV={k:k,d:vals(k)};

async function save(draft){var k=PV.k,T=TY[k],bs=['pvp','pvd','pvr'].map($);bs.forEach(function(b){b.disabled=true});
 try{var urls=[];for(var i=0;i<IM[k].length;i++){var m=IM[k][i];urls.push(m.url||await up(m.file))}
  var row=Object.assign({},PV.d);if(T.multi){row.images=urls;row.image_url=urls[0]}else row[T.img]=urls[0];row.published=!draft;
  var r=ED[k]?await sb.from(k).update(row).eq('id',ED[k]):await sb.from(k).insert(row);if(r.error)throw r.error;
  closePv();resetForm(k);toast(draft?'تم الحفظ كمسودة':'تم النشر بنجاح ✓');list(k)}catch(x){toast('خطأ: '+(x.message||x))}bs.forEach(function(b){b.disabled=false})}
async function shrink(file){if(!/^image\/(jpeg|png|webp)$/.test(file.type)||file.size<400000)return file;try{var b=await createImageBitmap(file),s=Math.min(1,2000/Math.max(b.width,b.height)),c=document.createElement('canvas');c.width=Math.round(b.width*s);c.height=Math.round(b.height*s);c.getContext('2d').drawImage(b,0,0,c.width,c.height);var png=file.type==='image/png',bl=await new Promise(function(r){c.toBlob(r,png?'image/png':'image/jpeg',.85)});return bl&&bl.size<file.size?new File([bl],file.name.replace(/\.\w+$/,png?'.png':'.jpg'),{type:bl.type}):file}catch(e){return file}}
async function up(file){file=await shrink(file);var n=Date.now()+'-'+Math.random().toString(36).slice(2,7)+'-'+file.name.replace(/[^\w.-]/g,'_'),r=await sb.storage.from('media').upload(n,file,{cacheControl:'31536000'});if(r.error)throw r.error;return sb.storage.from('media').getPublicUrl(n).data.publicUrl}
