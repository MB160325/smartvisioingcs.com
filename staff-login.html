<style>:root{--bg:#000;--rich:#0A0A0A;--gold:#D4AF37;--glow:#FFD54A;--bd:#C9A227;--ga:rgba(212,175,55,.25);--mut:#8F8F8F;--sec:#CFCFCF;--grad:linear-gradient(90deg,#8B6B15,#D4AF37,#FFD54A,#D4AF37,#8B6B15)}*{margin:0;padding:0;box-sizing:border-box}body{background:var(--bg);color:#fff;font-family:Inter,sans-serif;min-height:100dvh}a{color:var(--gold);text-decoration:none}.brand{font-weight:900;letter-spacing:3px}.brand span{background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent}input,select,textarea{width:100%;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.12);padding:13px 15px;border-radius:8px;color:#fff;font:inherit;outline:0;margin-bottom:14px}input:focus,select:focus,textarea:focus{border-color:var(--gold)}select option{background:#0a0a0a}label{display:block;color:var(--gold);font-size:.72rem;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:6px;font-weight:600}.btn{background:var(--grad);color:#000;border:0;border-radius:8px;padding:13px 22px;font:700 .8rem Inter,sans-serif;letter-spacing:1.5px;cursor:pointer}.btn.o{background:none;border:1px solid var(--bd);color:var(--gold)}.btn.d{background:none;border:1px solid #a33;color:#ff8a80;padding:7px 12px}.btn:disabled{opacity:.6}
body{display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(circle at 50% 0,rgba(212,175,55,.12),transparent 60%),#000}
.card{width:100%;max-width:430px;background:rgba(255,255,255,.03);border:1px solid var(--ga);border-radius:18px;padding:42px 36px;position:relative;overflow:hidden;box-shadow:0 0 40px rgba(212,175,55,.08)}.card:before{content:"";position:absolute;top:0;left:0;width:100%;height:4px;background:var(--grad)}
.logo{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:6px}.logo img{width:40px}.logo .brand{font-size:1.5rem}.tag{text-align:center;color:var(--mut);font-size:.65rem;letter-spacing:4px;text-transform:uppercase;margin-bottom:28px}
h1{font-size:1.05rem;text-align:center;margin-bottom:22px;letter-spacing:1px}.btn{width:100%}.msg{margin-top:14px;text-align:center;font-size:.85rem;min-height:1.2em}.lnk{display:block;text-align:center;margin-top:16px;font-size:.78rem;color:var(--mut);cursor:pointer}.lnk:hover{color:var(--gold)}.back{display:block;text-align:center;margin-top:22px;font-size:.75rem;color:var(--mut)}body:before{content:"";position:fixed;inset:0;background-image:linear-gradient(rgba(212,175,55,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(212,175,55,.04) 1px,transparent 1px);background-size:50px 50px;pointer-events:none;-webkit-mask-image:radial-gradient(circle at 50% 40%,#000,transparent 70%);mask-image:radial-gradient(circle at 50% 40%,#000,transparent 70%)}
.card{backdrop-filter:blur(18px);background:linear-gradient(160deg,rgba(255,255,255,.06),rgba(255,255,255,.015));box-shadow:0 30px 80px rgba(0,0,0,.7),0 0 60px rgba(212,175,55,.1);animation:up .8s cubic-bezier(.16,1,.3,1)}@keyframes up{from{opacity:0;transform:translateY(24px)}}
.card:after{content:"";position:absolute;inset:10px;border:1px solid rgba(212,175,55,.13);border-radius:12px;pointer-events:none}
.logo img{filter:drop-shadow(0 0 8px rgba(212,175,55,.6))}h1{font-weight:300;letter-spacing:3px;color:var(--sec)}
input{padding:14px 16px;border-radius:10px;background:rgba(255,255,255,.045)}input:focus{box-shadow:0 0 0 3px rgba(212,175,55,.12)}
.pwr{position:relative}.pwr button{position:absolute;right:12px;top:12px;background:none;border:0;color:var(--mut);cursor:pointer;font-size:.95rem}.pwr button:hover{color:var(--gold)}
.btn{padding:15px;transition:.3s}.btn:hover{box-shadow:0 0 28px rgba(212,175,55,.45);transform:translateY(-1px)}.sec{display:flex;justify-content:center;gap:8px;align-items:center;color:var(--mut);font-size:.68rem;margin-top:22px;letter-spacing:1px}.sec i{color:var(--gold)}.logo{flex-direction:column;gap:6px}.logo img{width:92px;filter:drop-shadow(0 0 16px rgba(212,175,55,.45))}body{padding-top:92px}
.bk{position:fixed;top:20px;right:22px;z-index:20;display:flex;align-items:center;gap:12px;padding:6px 8px 6px 20px;border-radius:60px;background:linear-gradient(135deg,rgba(255,255,255,.07),rgba(255,255,255,.02));border:1px solid rgba(212,175,55,.38);backdrop-filter:blur(14px);box-shadow:0 8px 30px rgba(0,0,0,.5);text-decoration:none;transition:.35s cubic-bezier(.16,1,.3,1)}
.bk:hover{border-color:var(--gold);box-shadow:0 10px 36px rgba(212,175,55,.22);transform:translateY(-2px)}
.bk .bt{display:flex;flex-direction:column;line-height:1.25;text-align:right}.bk .bt b{color:#fff;font:700 .86rem Cairo,Inter,sans-serif}.bk .bt small{color:var(--gold);font:600 .6rem Inter,sans-serif;letter-spacing:2px;text-transform:uppercase}
.bk .bi{width:40px;height:40px;border-radius:50%;background:var(--grad);display:flex;align-items:center;justify-content:center;color:#000;font-size:1rem;flex-shrink:0;transition:.35s}
.bk:hover .bi{transform:rotate(-8deg) scale(1.06)}.bk .ba{color:var(--gold);font-size:.85rem;transition:.35s}.bk:hover .ba{transform:translateX(5px)}
@media(max-width:560px){.bk{top:12px;right:12px;left:12px;justify-content:center;padding:6px 16px}.bk .bt{text-align:center;flex:1}body{padding-top:84px}}</style></head>
<body><a class="bk" href="index.html" aria-label="العودة إلى الموقع الرئيسي · Back to website"><span class="bi"><i class="fa-solid fa-house"></i></span><span class="bt"><b>العودة إلى الموقع</b><small>Back to website</small></span><i class="fa-solid fa-arrow-left-long ba"></i></a><div class="card"><div class="logo"><img src="assets/logo.png" alt="SMART VISION" onerror="this.remove()"><div class="brand">SMART <span>VISION</span></div></div><div class="tag">Staff Portal · بوابة الموظفين</div>
<h1 id="ttl">Sign in · تسجيل الدخول</h1>
<form id="f"><div id="fe"><label>Email · البريد الإلكتروني</label><input id="em" type="email" required autocomplete="username"></div>
<div id="fp"><label>Password · كلمة المرور</label><div class="pwr"><input id="pw" type="password" required minlength="6" autocomplete="current-password"><button type="button" id="eye" aria-label="show"><i class="fa-regular fa-eye"></i></button></div></div>
<button class="btn" id="go">Sign in · دخول</button></form><a class="lnk" id="fg">Forgot password? · نسيت كلمة المرور؟</a><div class="msg" id="m"></div>
<div class="sec"><i class="fa-solid fa-shield-halved"></i> SECURED ACCESS · اتصال مشفّر</div><a class="back" href="index.html"><i class="fa-solid fa-arrow-left-long"></i> smartvisiongcs.com</a></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script><script src="assets/sv-config.js"></script>
<script>
var C=window.SV||{},$=function(i){return document.getElementById(i)},mode='login',sb=null;
function msg(t,ok){$('m').style.color=ok?'#7bd88f':'#ff8a80';$('m').innerHTML=t}
function why(e){var m=(e&&e.message)||String(e||'');
 if(/invalid login credentials/i.test(m)){var ref=String(C.url||'').replace(/^https?:\/\//,'').split('.')[0];return 'Wrong email or password. · البريد أو كلمة المرور غير صحيحة.<br><small style="color:#9a9a9a;line-height:1.7;display:block;margin-top:8px">If you were invited by email you may not have a password yet — use “Forgot password?” or ask the admin to set one. Also make sure this user exists in the Supabase project <b style="color:#D4AF37">'+ref+'</b>.<br>إن كانت دعوتك بالإيميل فربما لم تُنشئ كلمة مرور بعد: استخدم «نسيت كلمة المرور؟» أو اطلب من المدير تعيينها، وتأكد أن المستخدم موجود في مشروع Supabase <b style="color:#D4AF37">'+ref+'</b>.</small>'}
 if(/email not confirmed/i.test(m))return 'This email is not confirmed yet. Confirm the user in Supabase (Authentication ▸ Users) or open the invitation email. · لم يتم تأكيد هذا البريد بعد.';
 if(/invalid api key|apikey/i.test(m))return 'Invalid API key in assets/sv-config.js. · مفتاح Supabase غير صحيح في ملف sv-config.js.';
 if(/fetch|network|load failed/i.test(m))return 'Cannot reach Supabase. Check the URL in assets/sv-config.js and your connection. · تعذر الاتصال بـ Supabase، تحقق من الرابط في sv-config.js.';
 if(/rate limit|too many/i.test(m))return 'Too many attempts, try again in a few minutes. · محاولات كثيرة، حاول بعد دقائق.';
 return m||'Unexpected error. · حدث خطأ غير متوقع.'}
function boot(){
 if(typeof supabase==='undefined'){msg('The login library could not load (blocked network?). Refresh, or check that cdn.jsdelivr.net is reachable. · تعذر تحميل مكتبة الدخول.');return false}
 if(!C.url||!C.key||/YOUR-/.test(C.url+C.key)){msg('Supabase is not configured yet — put the project URL and anon key in assets/sv-config.js. · لم تُضبط إعدادات Supabase بعد: ضع الرابط والمفتاح في assets/sv-config.js.');return false}
 try{sb=supabase.createClient(C.url,C.key)}catch(e){msg(why(e));return false}return true}
async function route(){
 var u=(await sb.auth.getUser()).data.user;if(!u)return;
 var q=await sb.from('profiles').select('role').eq('id',u.id).maybeSingle(),p=q.data;
 if(!p||p.role==='pending'){var c=await sb.rpc('claim_profile');if(!c.error&&c.data)p={role:c.data}}
 if(p&&(p.role==='admin'||p.role==='staff')){location.href='admin.html';return}
 await sb.auth.signOut();
 if(q.error&&!/PGRST116/.test(q.error.code||''))msg('Could not read your permissions ('+q.error.message+'). Run supabase/schema.sql and update-4-login-fix.sql in the SQL Editor. · تعذر قراءة الصلاحيات، شغّل ملفات SQL.');
 else msg('Your account is awaiting approval, or this email is not in the admin list. · حسابك بانتظار موافقة الإدارة أو أن بريدك غير مضاف لقائمة الأدمن.')}
var ok=boot();
if(ok){
 sb.auth.onAuthStateChange(function(e){if(e==='PASSWORD_RECOVERY'){mode='reset';$('fe').style.display='none';$('fg').style.display='none';$('ttl').textContent='New password · كلمة مرور جديدة';$('go').textContent='Save · حفظ';$('pw').autocomplete='new-password'}});
 route().catch(function(e){msg(why(e))});
}
$('f').onsubmit=async function(e){e.preventDefault();msg('');
 if(!ok&&!boot())return;
 $('go').disabled=true;
 try{
  if(mode==='reset'){var r=await sb.auth.updateUser({password:$('pw').value});if(r.error)throw r.error;msg('Updated ✓',1);await route();return}
  var r2=await sb.auth.signInWithPassword({email:$('em').value.trim().toLowerCase(),password:$('pw').value});if(r2.error)throw r2.error;
  await route();
 }catch(err){msg(why(err))}
 $('go').disabled=false};
$('fg').onclick=async function(){var v=$('em').value.trim();if(!v)return msg('Enter your email first. · أدخل بريدك أولاً.');if(!ok&&!boot())return;
 try{var r=await sb.auth.resetPasswordForEmail(v,{redirectTo:location.origin+location.pathname});msg(r.error?why(r.error):'Reset link sent. · تم إرسال رابط الاستعادة.',!r.error)}catch(e){msg(why(e))}};
$('eye').onclick=function(){var p=$('pw'),h=p.type==='password';p.type=h?'text':'password';this.firstChild.className=h?'fa-regular fa-eye-slash':'fa-regular fa-eye'};
</script></body></html>
